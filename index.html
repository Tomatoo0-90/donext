<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DoNext — Priority To-Do</title>
  <meta name="description" content="A simple offline to-do app that tells you what to do next. Works on phone, tablet and laptop.">
  <meta name="theme-color" content="#6d5efc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DoNext">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before the page paints (avoids a flash of the wrong theme)
    try {
      var s = JSON.parse(localStorage.getItem('donext.settings.v1') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="30" height="30">
        <span>DoNext</span>
      </div>

      <nav class="nav" aria-label="Views">
        <button class="nav-item" data-view="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="nav-label">Today</span><span class="badge" data-count="today"></span>
        </button>
        <button class="nav-item" data-view="plan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span class="nav-label">Plan</span>
        </button>
        <button class="nav-item" data-view="upcoming">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span class="nav-label">Upcoming</span><span class="badge" data-count="upcoming"></span>
        </button>
        <button class="nav-item" data-view="all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          <span class="nav-label">All</span><span class="badge" data-count="all"></span>
        </button>
        <button class="nav-item" data-view="matrix">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
          <span class="nav-label">Matrix</span>
        </button>
        <button class="nav-item" data-view="done">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.2 9.6"/></svg>
          <span class="nav-label">Done</span>
        </button>
      </nav>

      <p class="sidebar-hint">Press <kbd>N</kbd> to add a task</p>
    </aside>

    <main class="main">
      <div id="desktopModeTip" class="mode-tip" role="alert" hidden>
        <strong>Your browser is showing the desktop version.</strong>
        <span id="desktopModeHow"></span>
        <button type="button" id="desktopModeOk">Got it</button>
      </div>
      <header class="topbar">
        <div class="heading">
          <h1 id="viewTitle">Today</h1>
          <p id="viewSub" class="sub"></p>
        </div>
        <div class="top-actions">
          <button type="button" id="rankChip" class="rank-chip" aria-label="Your rank and XP">
            <span id="rankIcon" class="rank-icon">🌱</span>
            <span class="rank-text"><strong id="rankName">Rookie</strong><small id="rankXp">0 XP</small></span>
            <span class="rank-bar"><span id="rankBar"></span></span>
          </button>
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search" aria-label="Search tasks" autocomplete="off">
          </label>
          <div class="menu-wrap">
            <button id="menuBtn" class="icon-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
            </button>
            <div id="menu" class="menu" role="menu" hidden>
              <button role="menuitem" data-menu="theme">Theme: <strong id="themeLabel">System</strong></button>
              <button role="menuitem" data-menu="install" id="installItem">Install app</button>
              <hr>
              <button role="menuitem" data-menu="export">Export backup</button>
              <button role="menuitem" data-menu="import">Import backup</button>
              <hr>
              <a role="menuitem" href="https://github.com/Om-sharma31/donext" target="_blank" rel="noopener">View on GitHub</a>
            </div>
          </div>
        </div>
      </header>

      <form id="quickAdd" class="quick-add" autocomplete="off">
        <div class="quick-row">
          <svg class="quick-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <input id="quickInput" placeholder="Add a task…" aria-label="New task" maxlength="200" enterkeyhint="done">
          <button type="button" class="btn ghost small" id="detailsBtn">Details</button>
          <button type="submit" class="btn primary small">Add</button>
        </div>
        <p class="quick-hint">Shortcuts: <code>!h</code> <code>!m</code> <code>!l</code> priority · <code>#college</code> tag · <code>@today</code> <code>@tomorrow</code> <code>@fri</code> due date · <code>~30m</code> <code>~2h</code> time needed</p>
      </form>

      <section id="content" class="content"></section>
    </main>
  </div>

  <button class="fab" id="fab" aria-label="Add task">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="taskDialog" aria-labelledby="dlgTitle">
    <form id="taskForm" novalidate>
      <header class="dlg-head">
        <h2 id="dlgTitle">New task</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span>Task</span>
        <input name="title" maxlength="200" placeholder="What needs doing?" required>
      </label>

      <fieldset class="field">
        <legend>Priority</legend>
        <div class="segmented">
          <label><input type="radio" name="priority" value="high"><span class="seg p-high">High</span></label>
          <label><input type="radio" name="priority" value="medium"><span class="seg p-medium">Medium</span></label>
          <label><input type="radio" name="priority" value="low"><span class="seg p-low">Low</span></label>
        </div>
      </fieldset>

      <div class="row">
        <label class="field"><span>Due date</span><input type="date" name="due"></label>
        <label class="field"><span>Time <em>(optional)</em></span><input type="time" name="time"></label>
      </div>
      <div class="quick-dates">
        <button type="button" class="pill" data-due="0">Today</button>
        <button type="button" class="pill" data-due="1">Tomorrow</button>
        <button type="button" class="pill" data-due="7">Next week</button>
        <button type="button" class="pill" data-due="">No date</button>
      </div>

      <div class="row">
        <label class="field"><span>Tag</span><input name="tag" list="tagList" maxlength="30" placeholder="college, gym…"></label>
        <label class="field">
          <span>Repeat</span>
          <select name="repeat">
            <option value="none">Never</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
      </div>
      <datalist id="tagList"></datalist>

      <label class="field">
        <span>How long will it take? <em>(helps DoNext plan your day)</em></span>
        <select name="estimate">
          <option value="0">Not sure</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60">1 hour</option>
          <option value="90">1.5 hours</option>
          <option value="120">2 hours</option>
          <option value="180">3 hours</option>
          <option value="240">4 hours</option>
        </select>
      </label>
      <p id="aiHint" class="ai-hint" aria-live="polite"></p>

      <label class="field">
        <span>Notes</span>
        <textarea name="notes" rows="3" maxlength="2000" placeholder="Links, details, sub-steps…"></textarea>
      </label>

      <footer class="dlg-foot">
        <button type="button" class="btn ghost danger" id="dlgDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== "How long did it take?" (trains the AI) ===== -->
  <dialog id="logDialog" class="small-dialog" aria-labelledby="logTitle">
    <div class="log-wrap">
      <h2 id="logTitle">How long did it really take?</h2>
      <p id="logSub" class="set-note"></p>
      <div id="logChoices" class="log-choices"></div>
      <div class="log-foot">
        <button type="button" class="btn ghost small" id="logNever">Don't ask again</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost small" id="logSkip">Skip</button>
      </div>
    </div>
  </dialog>

  <!-- ===== Profile: rank, XP, badges ===== -->
  <dialog id="profileDialog" aria-label="Your profile">
    <div class="profile-wrap">
      <header class="dlg-head">
        <h2>Your progress</h2>
        <button type="button" class="icon-btn" data-close-profile aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="profileBody"></div>
    </div>
  </dialog>

  <!-- ===== Focus timer ===== -->
  <div id="focus" class="focus-overlay" role="dialog" aria-modal="true" aria-labelledby="focusTitle" hidden>
    <div class="focus-inner">
      <button type="button" class="focus-min" id="focusMin" aria-label="Minimise timer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <p class="focus-eyebrow">Focusing on</p>
      <h2 id="focusTitle"></h2>
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" id="focusRing" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-text"><span id="focusTime">25:00</span><small id="focusLabel">left</small></div>
      </div>
      <p class="focus-sub" id="focusSub"></p>
      <div class="focus-controls">
        <button type="button" class="fbtn" id="focusPause">Pause</button>
        <button type="button" class="fbtn" id="focusPlus">+5 min</button>
        <button type="button" class="fbtn" id="focusStop">Stop</button>
      </div>
      <button type="button" class="fbtn primary" id="focusDone">Mark task done</button>
      <button type="button" class="focus-notify" id="focusNotify" hidden>🔔 Notify me when time is up</button>
    </div>
  </div>
  <button type="button" class="focus-pill" id="focusPill" hidden>
    <span class="pill-dot"></span><span id="focusPillText"></span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastMsg"></span>
    <button id="toastUndo" class="toast-btn" type="button">Undo</button>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
  <script src="ai.js"></script>
  <script src="planner.js"></script>
  <script src="game.js"></script>
</body>
</html>
